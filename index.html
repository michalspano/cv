<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CV/Resume selector - Choose your preferred language and format">
    <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141b19" media="(prefers-color-scheme: dark)">
    <title>Curriculum vitae</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /*
         * Styled after michalspano.com: the same colours, type and
         * decorations. Colours are light-dark(<light>, <dark>) pairs and
         * follow the OS setting. The grain, contour map and mountains are the
         * site's own artwork, served from /assets/decor/ on the same domain;
         * where it is missing, the page simply stays plain.
         */

        :root {
            color-scheme: light dark;

            --font-body: "Iowan Old Style", "Palatino Linotype", "URW Palladio L", P052, Palatino, Georgia, serif;
            --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;

            --bg: light-dark(#f4f1e8, #141b19);
            --fg: light-dark(#1f2a24, #e3decf);
            --muted: light-dark(#56625b, #a3ab9f);
            --accent: light-dark(#2a6670, #93cfc0);
            --border: light-dark(#d8d2c0, #2c3732);

            --moss: light-dark(#bcd5b4, #3f5a45);
            --lake: light-dark(#b5d3e6, #34505f);
            --blaze: light-dark(#f2ab8c, #e99a7b);
            --highlight: light-dark(#c9e0bb, #36503d);
            --trail: light-dark(#97a598, #5d6e64);
            --grain: light-dark(rgb(80 66 40 / 0.18), rgb(225 220 200 / 0.07));
            --topo: light-dark(#d5ccb4, #27342f);
            --ridge-far: light-dark(#bfd2dc, #3b5361);
            --ridge-near: light-dark(#86a98d, #2b4a37);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            font-size: 112.5%;
            line-height: 1.6;
            /* The page fits the window; no rubber band past the mountains. */
            overscroll-behavior-y: none;
        }

        body {
            --ridge-height: clamp(5.5rem, 12vw, 10rem);

            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 1.5rem 1rem;
        }

        #app {
            width: 100%;
            max-width: 32rem;
        }

        ::selection {
            background: var(--highlight);
            color: var(--fg);
        }

        /* The card: a printed label on the paper. */
        .container {
            padding: 2rem 2rem 2.25rem;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
        }

        h2 {
            margin: 0 0 1.75rem;
            font-size: 1.9rem;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        /*
         * The two choices are two waypoints on a trail: language, then
         * format. A waypoint fills in once its choice is made.
         */
        [role="form"] {
            --trail-x: 0.45rem; /* centre of the trail, from the form's left edge */
            --waypoint: 0.75rem;
            --row-gap: 1.75rem;
            --label-size: 0.8rem;
            --label-mid: calc(var(--label-size) * 1.6 / 2); /* middle of a label's line */

            padding-left: 2rem;
        }

        .button-row {
            position: relative;
            margin-bottom: var(--row-gap);
        }

        .button-row:last-child {
            margin-bottom: 0;
        }

        .row-label {
            position: relative;
            display: block;
            margin-bottom: 0.75rem;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: var(--label-size);
            letter-spacing: 0.08em;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        /* One column on phones. */
        @media (max-width: 30rem) {
            .container {
                padding: 1.5rem 1.25rem 1.75rem;
            }

            h2 {
                font-size: 1.6rem;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }

        button {
            width: 100%;
            min-height: 44px;
            padding: 0.7rem 0.75rem;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover {
            border-color: var(--fg);
        }

        /* Chosen: filled, outlined in ink and bold, so not by colour alone. */
        button.selected {
            border-color: var(--fg);
            background: var(--moss);
            font-weight: 700;
        }

        /* Not reachable yet: a dashed outline, like a path still to walk. */
        button:disabled {
            border-style: dashed;
            color: var(--muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        button:disabled:hover {
            border-color: var(--border);
        }

        button:focus-visible {
            outline: 2px dashed var(--accent);
            outline-offset: 3px;
        }

        /* Decorations: pure CSS, never on top of text, and skipped for
           visitors who ask their OS for more contrast. ----------------- */
        @media screen and (prefers-contrast: no-preference) {
            /* Paper grain, fixed to the window. */
            html::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background: var(--grain);
                mask: url("/assets/decor/grain.svg");
                pointer-events: none;
            }

            /* A contour map in the top corner, fading out. */
            body::before {
                content: "";
                position: absolute;
                inset: 0 auto auto 0;
                z-index: -1;
                width: min(100%, 46rem);
                height: 30rem;
                background: var(--topo);
                mask:
                    url("/assets/decor/topo.svg") -10rem -7rem / 60rem auto no-repeat,
                    radial-gradient(farthest-side at 0 0, #000 45%, transparent);
                mask-composite: intersect;
                pointer-events: none;
            }

            /* Mountains and spruces along the bottom; the card sits above. */
            body {
                padding-bottom: var(--ridge-height);
            }

            body::after {
                content: "";
                position: absolute;
                inset: auto 0 0;
                z-index: -1;
                height: var(--ridge-height);
                background: linear-gradient(var(--ridge-far), var(--ridge-near) 80%);
                mask: url("/assets/decor/ridges.svg") bottom center / auto 100% repeat-x;
            }

            /* Printed slightly off register. */
            .container {
                box-shadow: 0.55rem 0.55rem 0 var(--lake);
            }

            /* A thin highlighter stroke under the title. */
            h2 {
                text-decoration: underline;
                text-decoration-color: color-mix(in srgb, var(--highlight) 60%, transparent);
                text-decoration-thickness: 0.2em;
                text-decoration-skip-ink: none;
                text-underline-offset: -0.08em;
            }

            /* Waypoints, centred on the trail and on the label's line. */
            .row-label::before {
                content: "";
                position: absolute;
                top: calc(var(--label-mid) - var(--waypoint) / 2);
                left: calc(var(--trail-x) - 2rem - var(--waypoint) / 2);
                width: var(--waypoint);
                height: var(--waypoint);
                border: 2px solid var(--trail);
                border-radius: 50%;
                background: var(--bg);
            }

            /* You are here: the choice on this row is made. */
            .button-row:has(.selected) .row-label::before {
                border-color: var(--fg);
                background: var(--blaze);
            }

            /* The dashed path from each waypoint down to the next one. */
            .button-row:not(:last-child)::before {
                content: "";
                position: absolute;
                top: var(--label-mid);
                bottom: calc(-1 * (var(--row-gap) + var(--label-mid)));
                left: calc(var(--trail-x) - 2rem - 1px);
                width: 2px;
                background: repeating-linear-gradient(var(--trail) 0 0.35rem, transparent 0.35rem 0.7rem);
            }
        }

        /* Forced-colours modes repaint everything; drop the pictures. */
        @media (forced-colors: active) {
            html::before,
            body::before,
            body::after {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h2>Curriculum vitae</h2>
            <div role="form" aria-label="Resume selector">
                <div class="button-row" v-for="(row, index) in rows" :key="row.id">
                    <label class="row-label" :for="`${row.id}-group`">{{ row.label }}:</label>
                    <div class="button-group" :id="`${row.id}-group`" role="group" :aria-label="`${row.label} options`">
                        <button 
                            v-for="option in row.options" 
                            :key="option.value"
                            :class="{ selected: option.value === row.selected }"
                            :disabled="index === 1 && !rows[0].selected"
                            :aria-pressed="option.value === row.selected"
                            :aria-label="`${row.label}: ${option.label}`"
                            @click="selectOption(index, option.value)"
                        >
                            {{ option.label }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, watch } = Vue;

        createApp({
            setup() {
                const rows = ref([
                    {
                        id: 'language',
                        label: 'Language',
                        selected: null,
                        options: [
                            { label: 'English',    value: 'en' },
                            { label: 'Svenska',    value: 'se' },
                            { label: 'Slovenčina', value: 'sk' }
                        ]
                    },
                    {
                        id: 'type',
                        label: 'Format',
                        selected: null,
                        options: [
                            { label: 'PDF',  value: 'pdf'  },
                            { label: 'HTML', value: 'html' },
                            { label: 'TXT',  value: 'txt'  }
                        ]
                    }
                ]);
              
                const selectOption = (rowIndex, value) => {
                    if (rowIndex === 0) {
                        rows.value[1].selected = null;
                    }
                    rows.value[rowIndex].selected = value;
                };
                watch(rows, (newRows) => {
                      if (newRows[1].selected && newRows[1].selected) {
                          const lang = newRows[0].selected;
                          const type = newRows[1].selected;
                          if (lang !== 'sk') {
                            window.location.href = `public/${lang}.${type}`;
                          } else {
                            console.log('TODO: add support for Slovak.');
                          }
                      }
                  }, { deep: true });

                return {
                    rows,
                    selectOption
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
